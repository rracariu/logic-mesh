name: Cargo Publish

on:
  release:
    types: [published]

permissions:
  contents: read

# Every job must succeed for the next one to run: nothing is uploaded
# until preflight has checked both crates, and logic-mesh is only
# published once the exact logic_mesh_block_macro it requires is on
# crates.io. Each publish is skipped when its version is already
# there, so re-running a release after a failure picks up where it
# stopped.
jobs:
  preflight:
    name: Check the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Match the release tag against the crate versions
        id: versions
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(.github/scripts/check-versions.sh "$TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # main.yml's package job runs the same check, but nothing makes a
      # release wait for it, and a published version can never be
      # changed. Both crates are checked here, before either is
      # uploaded. `--no-verify`, as `cargo publish` compiles each crate
      # from its archive anyway.
      - name: Check that the packaged crates carry the license
        run: |
          cargo package --locked --no-verify -p logic_mesh_block_macro -p logic-mesh
          .github/scripts/check-crate-license.sh logic_mesh_block_macro logic-mesh

  publishMacro:
    name: Publish block macro lib
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # `cargo publish` returns once the new version is in the index,
      # so the next job can resolve it.
      - name: Publish logic_mesh_block_macro
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          published=$(.github/scripts/crate-published.sh logic_mesh_block_macro "$VERSION")
          if [ "$published" = true ]; then
            echo "logic_mesh_block_macro $VERSION is already on crates.io, skipping."
          else
            cargo publish --locked -p logic_mesh_block_macro
          fi

  publish:
    name: Publish main crate
    runs-on: ubuntu-latest
    needs: [preflight, publishMacro]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish logic-mesh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
        run: |
          published=$(.github/scripts/crate-published.sh logic-mesh "$VERSION")
          if [ "$published" = true ]; then
            echo "logic-mesh $VERSION is already on crates.io, skipping."
          else
            cargo publish --locked -p logic-mesh
          fi
