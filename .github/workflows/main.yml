on:
  push:
    branches: [main]
  pull_request:

name: Build

# A new push to the same branch/PR supersedes the previous run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.features == '' && 'default' || matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
        features:
          - ""
          - "multi-threaded"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Run cargo check
        run: cargo check --workspace --all-targets ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      # `--workspace` unifies features across the members it builds, and
      # tests_lib_usage enables `multi-threaded`, so the step above never
      # builds logic-mesh with its default features alone. Selecting
      # only logic-mesh does. The clippy and docs jobs do the same.
      - name: Run cargo check (logic-mesh, default features)
        if: matrix.features == ''
        run: cargo check -p logic-mesh --all-targets

  test:
    name: Test Suite (${{ matrix.features == '' && 'default' || matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
        features:
          - ""
          - "multi-threaded"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Run cargo test
        run: cargo test --workspace ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.features == '' && 'default' || matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
        features:
          - ""
          - "multi-threaded"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.features && format('--features {0}', matrix.features) || '' }} -- -D warnings

      # See the check job: without this, logic-mesh is only linted with
      # `multi-threaded` on.
      - name: Run cargo clippy (logic-mesh, default features)
        if: matrix.features == ''
        run: cargo clippy -p logic-mesh --all-targets -- -D warnings

  docs:
    name: Docs (${{ matrix.features == '' && 'default' || matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
        features:
          - ""
          - "multi-threaded"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Run cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      # See the check job: without this, a doc link from default code
      # to a `multi-threaded`-only item would go unnoticed.
      - name: Run cargo doc (logic-mesh, default features)
        if: matrix.features == ''
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps -p logic-mesh

  docs-wasm:
    name: Docs (wasm32)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown

      - name: Run cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --target wasm32-unknown-unknown

  clippy-wasm:
    name: Clippy (wasm32)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown
          components: clippy

      # Library only, no `--all-targets`: that would pull in the
      # dev-dependencies of the native `tui_runner` example (crossterm),
      # which do not build for wasm32.
      - name: Run cargo clippy
        run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings
