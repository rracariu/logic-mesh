on:
  push:
    branches: [main]
  pull_request:

name: Build

# A new push to the same branch/PR supersedes the previous run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.features == '' && 'default' || matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
        features:
          - ""
          - "multi-threaded"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Run cargo check
        run: cargo check --workspace --all-targets ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      # `--workspace` unifies features across the members it builds, and
      # tests_lib_usage enables `multi-threaded`, so the step above never
      # builds logic-mesh with its default features alone. Selecting
      # only logic-mesh does. The clippy and docs jobs do the same.
      - name: Run cargo check (logic-mesh, default features)
        if: matrix.features == ''
        run: cargo check -p logic-mesh --all-targets

  test:
    name: Test Suite (${{ matrix.features == '' && 'default' || matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
        features:
          - ""
          - "multi-threaded"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Run cargo test
        run: cargo test --workspace ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt --all --check

  clippy:
    name: Clippy (${{ matrix.features == '' && 'default' || matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
        features:
          - ""
          - "multi-threaded"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets ${{ matrix.features && format('--features {0}', matrix.features) || '' }} -- -D warnings

      # See the check job: without this, logic-mesh is only linted with
      # `multi-threaded` on.
      - name: Run cargo clippy (logic-mesh, default features)
        if: matrix.features == ''
        run: cargo clippy -p logic-mesh --all-targets -- -D warnings

  docs:
    name: Docs (${{ matrix.features == '' && 'default' || matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
        features:
          - ""
          - "multi-threaded"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Run cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --workspace ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      # See the check job: without this, a doc link from default code
      # to a `multi-threaded`-only item would go unnoticed.
      - name: Run cargo doc (logic-mesh, default features)
        if: matrix.features == ''
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps -p logic-mesh

  docs-wasm:
    name: Docs (wasm32)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown

      - name: Run cargo doc
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --target wasm32-unknown-unknown

  clippy-wasm:
    name: Clippy (wasm32)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown
          components: clippy

      # Library only, no `--all-targets`: that would pull in the
      # dev-dependencies of the native `tui_runner` example (crossterm),
      # which do not build for wasm32.
      - name: Run cargo clippy
        run: cargo clippy --lib --target wasm32-unknown-unknown -- -D warnings

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      # Builds the two crates `cargo publish` would upload and compiles
      # each from its .crate file. logic-mesh is verified against the
      # freshly packaged block macro through a temporary local registry,
      # so this works before that macro version is on crates.io. The
      # crates are named instead of using `--workspace`, which would
      # also package the `publish = false` test crates and fail on
      # their path-only dependency on logic-mesh.
      - name: Run cargo package
        run: cargo package --locked -p logic_mesh_block_macro -p logic-mesh

      # BSD-3-Clause requires the license text in every copy of the
      # source, so each .crate must carry the root LICENSE.
      - name: Check that the packaged crates carry the license
        run: .github/scripts/check-crate-license.sh logic_mesh_block_macro logic-mesh

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      # The MSRV is logic-mesh's `rust-version`; changing it in
      # Cargo.toml moves this job with it.
      - name: Install MSRV toolchain
        id: msrv
        run: |
          msrv=$(cargo metadata --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "logic-mesh") | .rust_version')
          rustup toolchain install "$msrv" --profile minimal --target wasm32-unknown-unknown
          echo "toolchain=$msrv" >> "$GITHUB_OUTPUT"

      # rust-toolchain.toml pins `stable`, which a bare `cargo` would
      # pick; `cargo +<toolchain>` overrides it. As in the check job,
      # `--workspace` builds logic-mesh with `multi-threaded` on either
      # way, so the default-features check selects logic-mesh alone.
      - name: Run cargo check (logic-mesh, default features)
        run: cargo +${{ steps.msrv.outputs.toolchain }} check --locked -p logic-mesh --all-targets

      - name: Run cargo check (multi-threaded)
        run: cargo +${{ steps.msrv.outputs.toolchain }} check --locked --workspace --all-targets --features multi-threaded

      - name: Run cargo check (wasm32)
        run: cargo +${{ steps.msrv.outputs.toolchain }} check --locked --lib --target wasm32-unknown-unknown

  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      # The release workflows run the same check against the release
      # tag; failing here first keeps main releasable.
      - name: Check that the crate and npm versions agree
        run: .github/scripts/check-versions.sh
