on:
  pull_request:

name: WebCheck

# A new push to the PR branch supersedes the previous check run.
concurrency:
  group: web-check-${{ github.ref }}
  cancel-in-progress: true

# This workflow runs only on pull requests, so npm-publish.yml repeats
# every one of these checks before it publishes. Change both together.
jobs:
  site:
    name: Check demo site build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: wasm-pack installer
        run: curl https://wasm-bindgen.github.io/wasm-pack/installer/init.sh -sSf | bash
      - name: install
        run: npm ci

      - name: format check
        run: |
          npm run format:check --workspace=logic-mesh
          npm run format:check --workspace=web-app

      - name: wasm-build
        run: npm run build --workspace=logic-mesh

      # publint + attw on the manifest, then pack the package, install the
      # tarball into a scratch project and import it with plain `node`.
      - name: package check
        run: |
          npm run check:package --workspace=logic-mesh
          npm run test:pack --workspace=logic-mesh

      - name: lint
        run: |
          npm run lint --workspace=logic-mesh
          npm run lint --workspace=web-app

      - name: test
        run: |
          npm test --workspace=logic-mesh
          npm test --workspace=web-app

      - name: build
        run: npm run build --workspace=web-app

      # The low end of the package's `engines` range: 22.19 is the first
      # Node 22 release that imports the wasm module without
      # --experimental-wasm-modules. Kept last, as it swaps the job's Node.
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
      - name: package smoke test on the minimum Node
        run: npm run test:pack --workspace=logic-mesh
