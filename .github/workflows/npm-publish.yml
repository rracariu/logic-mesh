name: NPM Publish

on:
  release:
    types: [published]

# Publishing authenticates with npm Trusted Publishing (OIDC), and
# there is deliberately no NPM_TOKEN fallback. It only works once the
# logic-mesh package settings on npmjs.com list repository
# rracariu/logic-mesh with workflow npm-publish.yml as a trusted
# publisher. `id-token: write` lets npm request the OIDC token it
# authenticates with and signs the provenance statement with.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v6

      - name: Match the release tag against the package versions
        working-directory: .
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: .github/scripts/check-versions.sh "$TAG"

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          package-manager-cache: false

      # Every check web-check.yml runs, in the same order, on the build
      # this job publishes. web-check.yml runs only on pull requests,
      # and a commit can reach main without one, so this job is the
      # only gate every release passes. Keep the two in step.
      - name: wasm-pack installer
        run: curl https://wasm-bindgen.github.io/wasm-pack/installer/init.sh -sSf | bash
      - name: install
        run: npm ci

      - name: format check
        run: |
          npm run format:check --workspace=logic-mesh
          npm run format:check --workspace=web-app

      - name: wasm-build
        run: npm run build --workspace=logic-mesh

      # publint + attw on the manifest, then pack the package, install the
      # tarball into a scratch project and import it with plain `node`.
      - name: package check
        run: |
          npm run check:package --workspace=logic-mesh
          npm run test:pack --workspace=logic-mesh

      - name: lint
        run: |
          npm run lint --workspace=logic-mesh
          npm run lint --workspace=web-app

      - name: test
        run: |
          npm test --workspace=logic-mesh
          npm test --workspace=web-app

      - name: build
        run: npm run build --workspace=web-app

      # The low end of the package's `engines` range: 22.19 is the first
      # Node 22 release that imports the wasm module without
      # --experimental-wasm-modules.
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: package smoke test on the minimum Node
        run: npm run test:pack --workspace=logic-mesh

      # Back to the LTS to publish: Trusted Publishing needs npm 11.5.1
      # or later, and Node 22.19.0 ships npm 10.
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # Prereleases (2.1.0-rc.1) go to the `next` dist-tag so that
      # `npm install logic-mesh` keeps resolving to the latest release.
      - name: publish
        working-directory: ./web/packages/logic-mesh
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ $version == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
