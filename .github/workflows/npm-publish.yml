name: NPM Publish

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false


      - name: install
        run: npm install -g wasm-pack && npm ci

      - name: wasm-build
        run: npm run build --workspace=logic-mesh

      - name: publish
        run: npm publish --provenance --access public
        working-directory: ./web/packages/logic-mesh
