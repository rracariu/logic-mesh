[package]
name = "logic-mesh"
version = "1.0.0"
edition = "2024"
authors = ["Radu Racariu <radu.racariu@gmail.com>"]
description = "Control logic engine using event based and reactive blocks written in Rust."
repository = "https://github.com/rracariu/logic-mesh"
keywords = ["logic", "control", "reactive", "wasm", "low-code"]
categories = ["asynchronous", "wasm"]
license = "BSD-3-Clause"
# Keep the published crate to what a Rust user needs. The web/ tree is
# the SvelteKit demo + npm packages; .github/, .vscode/, and developer
# shell scripts are repo-only tooling. `screen-shot.png` stays because
# the README embeds it (rendered on docs.rs).
exclude = [
	"web/**",
	".github/**",
	".vscode/**",
	"build-wasm.sh",
	".cargo/**",
	"rust-toolchain.toml",
]

[workspace]
members = ["block_macro"]

[features]
default = []
multi-threaded = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
logic_mesh_block_macro = { path = "block_macro", version = "1.0.0" }
serde = { version = "^1.0", features = ["derive"] }
libhaystack = { version = "^3.1", default-features = false, features = [
	"value",
	"zinc",
	"json",
	"units",
	"units-db",
] }
uuid = { version = "^1.23", features = ["v4"] }
futures = "^0.3"
rand = "^0.9"
anyhow = "^1.0"
log = "^0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "^1.50", features = [
	"rt-multi-thread",
	"sync",
	"time",
	"macros",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "^1.50", features = ["rt", "sync", "time", "macros"] }
wasm-bindgen = { version = "^0.2", features = ["serde-serialize"] }
serde-wasm-bindgen = "^0.6"
js-sys = "^0.3"
wasm-bindgen-futures = "^0.4"
wasm-bindgen-console-logger = "^0.1"
console_error_panic_hook = "^0.1"
getrandom = { version = "^0.3", default-features = false, features = [
	"wasm_js",
] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[dev-dependencies]
wasm-bindgen-test = "^0.3"
assert_matches = "^1.5"

[profile.release]
opt-level = "z"
lto = "thin"
strip = "symbols"
