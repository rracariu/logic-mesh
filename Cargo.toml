[package]
name = "logic-mesh"
version = "2.0.0"
edition = "2024"
# The lowest toolchain that builds the workspace (CI's `msrv` job reads
# it from here). Let-chains need 1.88, and so do several dependencies.
rust-version = "1.88"
authors = ["Radu Racariu <radu.racariu@gmail.com>"]
description = "Control logic engine using event based and reactive blocks written in Rust."
repository = "https://github.com/rracariu/logic-mesh"
keywords = ["logic", "control", "reactive", "wasm", "low-code"]
categories = ["asynchronous", "wasm"]
license = "BSD-3-Clause"
# Keep the published crate to what a Rust user needs. The web/ tree is
# the SvelteKit demo + npm packages; .github/, .vscode/, and developer
# shell scripts are repo-only tooling. `screen-shot.png` stays because
# the README embeds it (rendered on docs.rs).
exclude = [
	"web/**",
	".github/**",
	".vscode/**",
	"build-wasm.sh",
	".cargo/**",
	"rust-toolchain.toml",
	"tests_lib_usage/**",
	"tests_lib_renamed/**",
]

[workspace]
members = ["block_macro", "tests_lib_usage", "tests_lib_renamed"]

[lints]
workspace = true

[features]
default = ["js"]
# The JavaScript bindings, on wasm32: the `wasm` module (`BlocksEngine`,
# the engine commands, JS blocks and connectors) and the module's start
# hook, which installs a panic hook and a console logger. The npm
# package is built with it. A Rust application that builds this crate
# for wasm32 and has bindings of its own turns it off with
# `default-features = false`; the engine still runs there without it,
# but rejects external blocks as other targets do. Other targets ignore
# the feature.
js = [
	"dep:serde-wasm-bindgen",
	"dep:wasm-bindgen-console-logger",
	"dep:console_error_panic_hook",
]
# The multi-threaded engine, for a tokio multi-thread runtime. Native
# targets only: wasm32 has no threads to run it on, and there the
# feature adds nothing. It enables no tokio feature: the engine only
# spawns onto the runtime it is called from, and the application that
# builds that runtime enables `rt-multi-thread` on its own tokio. Cargo
# cannot enable a dependency feature for one target only, and tokio
# rejects `rt-multi-thread` on wasm32, so enabling it here would break
# every wasm32 build of a crate that turns this feature on.
multi-threaded = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned exactly: the macro generates calls into `logic_mesh::__private`,
# which only this exact version of the crate provides.
logic_mesh_block_macro = { path = "block_macro", version = "=2.0.0" }
serde = { version = "^1.0", features = ["derive"] }
libhaystack = { version = "^4.0", default-features = false, features = [
	"value",
	"zinc",
	"json",
	"units",
	"units-db",
] }
uuid = { version = "^1.23", features = ["v4"] }
# The type of a program's opaque editor metadata. libhaystack's `json`
# feature already builds it.
serde_json = "^1.0"
futures = "^0.3"
rand = "^0.9"
thiserror = "^2.0"
log = "^0.4"
# The engines need the scheduler-independent runtime pieces (`rt`)
# only, natively as on wasm32; which runtime drives them is the
# application's choice.
tokio = { version = "^1.50", features = ["rt", "sync", "time", "macros"] }

# The engine's timers and clocks need wasm-bindgen, js-sys and
# wasm-bindgen-futures on wasm32 with or without the `js` bindings.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "^1.23", features = ["v4", "js"] }
wasm-bindgen = { version = "^0.2", features = ["serde-serialize"] }
serde-wasm-bindgen = { version = "^0.6", optional = true }
js-sys = "^0.3"
wasm-bindgen-futures = "^0.4"
wasm-bindgen-console-logger = { version = "^0.1", optional = true }
console_error_panic_hook = { version = "^0.1", optional = true }
getrandom = { version = "^0.3", default-features = false, features = [
	"wasm_js",
] }

# Document the multi-threaded engine on docs.rs too; it is behind a
# feature, so a default build would leave it out. The wasm32 build,
# which docs.rs offers in its platform menu, adds the JavaScript
# bindings (the `wasm` module, from the default `js` feature) and the
# wasm32 forms of the block and connector traits.
[package.metadata.docs.rs]
features = ["multi-threaded"]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[dev-dependencies]
wasm-bindgen-test = "^0.3"
assert_matches = "^1.5"
# For the `tui_runner` example only. The library reports typed errors
# (see `logic_mesh::Error`); applications on top of it are free to keep
# collapsing those into `anyhow`.
anyhow = "^1.0"
ratatui = "^0.30"
crossterm = "^0.29"

# The tests drive engines from a multi-thread runtime on a thread of
# their own, and the multi-threaded engine's doctest runs on one, as an
# application's would: like an application, they enable the runtime
# flavor they use on their own tokio.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "^1.50", features = ["rt-multi-thread", "macros"] }

[[example]]
name = "minimal"
# No special features; runs on the default ST engine via a hand-driven
# execute loop, no scheduler needed.

[[example]]
name = "connector_demo"
# Implements the `Connector` trait in application code — the library
# ships only the contract and the generic external blocks — and runs
# a simulated transport on the default ST engine. No special features.

[[example]]
name = "tui_runner"
# Uses `MultiThreadedEngine` so the engine.run() task can be spawned
# via `tokio::spawn` while ratatui drives the main thread.
required-features = ["multi-threaded"]

[workspace.lints.clippy]
missing_docs_in_private_items = "allow"

[workspace.lints.rust]
missing_docs = "warn"

[profile.release]
opt-level = "z"
lto = "thin"
strip = "symbols"
